<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Thrust Land Proto — 按住调姿→落地</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; color: #e8eefc; }
  canvas { position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #hud {
    position: fixed; left: 12px; top: 12px; right: 220px;
    pointer-events: none; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 13px; line-height: 1.35; opacity: 0.92;
    text-shadow: 0 1px 2px #000a;
  }
  #hud b { color: #8ec5ff; font-weight: 600; }
  #alt {
    font-variant-numeric: tabular-nums;
    color: #b8f0c8;
  }
  #fuel {
    font-variant-numeric: tabular-nums;
    color: #ffd28a;
    min-width: 140px;
  }
  #fuel .bar {
    display: inline-block; vertical-align: middle;
    width: 72px; height: 8px; margin-left: 6px;
    border-radius: 4px; background: #243048; overflow: hidden;
    border: 1px solid #4a5a78;
  }
  #fuel .bar > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #e8a23a, #ffe08a);
    transform-origin: left center;
  }
  #fuel.low { color: #ff8a8a; }
  #fuel.low .bar > i { background: linear-gradient(90deg, #c04040, #ff8888); }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 2; pointer-events: none;
    background: #111a2ecc; border: 1px solid #335; border-radius: 10px;
    padding: 8px 14px; font-size: 12px; max-width: min(92vw, 520px);
    text-align: center; color: #c9d4ee;
  }
  #params {
    position: fixed; right: 12px; top: 12px; z-index: 3;
    background: #111a2ee6; border: 1px solid #335; border-radius: 10px;
    padding: 10px 12px; font-size: 12px; width: 200px;
    pointer-events: auto;
  }
  #params label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 6px 0; }
  #params input[type=range] { width: 96px; }
  #params button {
    width: 100%; margin-top: 8px; padding: 7px 0; border-radius: 8px;
    border: 1px solid #4a6; background: #1a3a28; color: #dfffe8; cursor: pointer;
  }
  #params button:hover { background: #234e35; }
  #params .title { font-weight: 600; color: #8ec5ff; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="hud">
  <span><b>Thrust Land</b> · 手感原型 <b>v6</b></span>
  <span id="alt">高度 — m</span>
  <span id="fuel">燃料 —</span>
  <span id="stat">就绪</span>
</div>
<div id="params">
  <div class="title">参数</div>
  <label>推力 <span id="vThrust">90</span><input id="thrust" type="range" min="40" max="360" value="90" /></label>
  <label>偏角° <span id="vAngle">60</span><input id="angle" type="range" min="15" max="80" value="60" /></label>
  <label>重力 <span id="vG">55</span><input id="g" type="range" min="20" max="120" value="55" /></label>
  <label>阻尼 <span id="vDrag">0.35</span><input id="drag" type="range" min="0" max="80" value="35" /></label>
  <button id="resetBtn" type="button">复位 (R)</button>
</div>
<div id="hint">触屏：按住拖动喷气（底栏喷气区也可）· 多指各绑最近喷口 · 燃料有限（快抖易耗尽）· 换口有短冷却 · 鼠标左/右键 · R 复位加满 · 开局约 3000 m 随机倾角</div>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const statEl = document.getElementById("stat");
  const altEl = document.getElementById("alt");
  const fuelEl = document.getElementById("fuel");

  // World units: 1 unit ≈ 1 m. +Y is down (canvas-like). Ground at y = 0.
  // Altitude = groundY - craftLowestY (机体最低点到地面).
  const cfg = {
    thrust: 90,
    maxAngleDeg: 60,
    gravity: 55,
    linearDrag: 0.35,
    angularDrag: 8,
    torqueCoef: 0.011,
    omegaCap: 2.2,
    bodyW: 56,
    bodyH: 96,
    nozzleCount: 9,
    nozzleMarginX: 6,
    nozzleY: 0.48, // local +Y down; bottom edge relative to center
    spawnAltitude: 3000,
    camLerp: 6,
    craftScreenFrac: 0.36, // craft Y within playable viewport (from top)
    // v6 anti-shake: fuel + per-nozzle cooldown + random spawn tilt
    fuelMax: 100,
    fuelBurnPerSec: 7.5, // per actively thrusting nozzle; ~13s single-nozzle continuous
    nozzleCooldownMs: 150,
    spawnTiltMinDeg: 15,
    spawnTiltMaxDeg: 45,
  };

  const world = { w: 800, h: 600, groundY: 0 };
  const cam = { x: 0, y: 0 };
  let controlH = 160;
  let playH = 440;

  const craft = {
    x: 0, y: 0, vx: 0, vy: 0, angle: 0, omega: 0,
  };

  let fuel = cfg.fuelMax;
  /** @type {number[]} absolute ms timestamps; nozzle i ready when performance.now() >= this */
  let nozzleReadyAt = [];
  /** last bound nozzle per pointer id — detect switch for cooldown */
  const pointerNozzlePrev = new Map();

  /** @type {{id:string,x:number,y:number,active:boolean,nx:number,ny:number,fx:number,fy:number,flameX:number,flameY:number,nozzle:number|null,button?:number}[]} */
  let pointers = [];

  function bindParams() {
    const map = [
      ["thrust", "vThrust", v => { cfg.thrust = +v; return String(v); }],
      ["angle", "vAngle", v => { cfg.maxAngleDeg = +v; return String(v); }],
      ["g", "vG", v => { cfg.gravity = +v; return String(v); }],
      ["drag", "vDrag", v => { cfg.linearDrag = (+v) / 100; return ((+v) / 100).toFixed(2); }],
    ];
    for (const [id, vid, fn] of map) {
      const el = document.getElementById(id);
      const lab = document.getElementById(vid);
      const sync = () => { lab.textContent = fn(el.value); };
      el.addEventListener("input", sync);
      sync();
    }
    document.getElementById("resetBtn").addEventListener("click", reset);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vv = window.visualViewport;
    world.w = vv ? vv.width : window.innerWidth;
    world.h = vv ? vv.height : window.innerHeight;
    canvas.width = Math.floor(world.w * dpr);
    canvas.height = Math.floor(world.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    controlH = Math.max(140, Math.round(world.h * 0.25));
    playH = world.h - controlH;
  }

  function randomSpawnTilt() {
    const min = cfg.spawnTiltMinDeg;
    const max = cfg.spawnTiltMaxDeg;
    const deg = min + Math.random() * (max - min);
    const sign = Math.random() < 0.5 ? -1 : 1;
    return sign * deg * Math.PI / 180;
  }

  function resetNozzleCooldowns() {
    nozzleReadyAt = Array.from({ length: cfg.nozzleCount }, () => 0);
  }

  function armNozzleCooldown(i, now) {
    if (i == null || i < 0) return;
    const until = now + cfg.nozzleCooldownMs;
    if (until > nozzleReadyAt[i]) nozzleReadyAt[i] = until;
  }

  function noteNozzleBind(pointerId, nozzle, now) {
    const prev = pointerNozzlePrev.has(pointerId)
      ? pointerNozzlePrev.get(pointerId)
      : null;
    if (prev != null && prev !== nozzle) {
      // left a nozzle after spraying → that mouth cools before reuse
      armNozzleCooldown(prev, now);
      // actual switch (not first bind) → new mouth also waits briefly
      if (nozzle != null) armNozzleCooldown(nozzle, now);
    }
    if (nozzle == null) pointerNozzlePrev.delete(pointerId);
    else pointerNozzlePrev.set(pointerId, nozzle);
  }

  function reset() {
    craft.x = 0;
    // bottom ≈ craft.y + bodyH/2 when upright; want altitude ≈ spawnAltitude
    craft.y = world.groundY - cfg.spawnAltitude - cfg.bodyH / 2;
    craft.vx = 0;
    craft.vy = 0;
    craft.angle = randomSpawnTilt();
    craft.omega = 0;
    fuel = cfg.fuelMax;
    resetNozzleCooldowns();
    pointerNozzlePrev.clear();
    pointers = [];
    cam.x = craft.x;
    cam.y = craft.y + world.h / 2 - playH * cfg.craftScreenFrac;
    const deg = (craft.angle * 180 / Math.PI).toFixed(0);
    statEl.textContent = `已复位 · 倾角 ${deg}° · 燃料满`;
  }

  function rot(lx, ly, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: lx * c - ly * s, y: lx * s + ly * c };
  }

  function nozzleLocal(i) {
    const n = cfg.nozzleCount;
    const half = cfg.bodyW / 2;
    const left = -half + cfg.nozzleMarginX;
    const right = half - cfg.nozzleMarginX;
    const t = n <= 1 ? 0.5 : i / (n - 1);
    return { x: left + (right - left) * t, y: cfg.bodyH * cfg.nozzleY };
  }

  function nozzleWorld(i) {
    const l = nozzleLocal(i);
    const r = rot(l.x, l.y, craft.angle);
    return { x: craft.x + r.x, y: craft.y + r.y };
  }

  function bodyDown() {
    return rot(0, 1, craft.angle);
  }

  /** Lowest point of craft AABB corners in world Y (+Y down). */
  function craftLowestY() {
    const halfW = cfg.bodyW / 2, halfH = cfg.bodyH / 2;
    let maxY = -Infinity;
    const corners = [
      [-halfW, -halfH], [halfW, -halfH],
      [-halfW, halfH], [halfW, halfH],
    ];
    for (const [lx, ly] of corners) {
      const r = rot(lx, ly, craft.angle);
      const wy = craft.y + r.y;
      if (wy > maxY) maxY = wy;
    }
    return maxY;
  }

  /** Altitude in meters: ground to craft lowest point. */
  function altitude() {
    return world.groundY - craftLowestY();
  }

  function clampAngle(vec, maxDeg) {
    const down = bodyDown();
    const maxRad = maxDeg * Math.PI / 180;
    let vx = vec.x, vy = vec.y;
    const len = Math.hypot(vx, vy) || 1;
    vx /= len; vy /= len;
    const cross = down.x * vy - down.y * vx;
    const dot = down.x * vx + down.y * vy;
    let ang = Math.atan2(cross, dot);
    if (ang > maxRad) ang = maxRad;
    if (ang < -maxRad) ang = -maxRad;
    const c = Math.cos(ang), s = Math.sin(ang);
    return {
      x: down.x * c - down.y * s,
      y: down.x * s + down.y * c,
    };
  }

  function screenToWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const sx = (clientX - rect.left) * (world.w / rect.width);
    const sy = (clientY - rect.top) * (world.h / rect.height);
    return {
      x: sx + cam.x - world.w / 2,
      y: sy + cam.y - world.h / 2,
    };
  }

  function occupiedNozzles(exceptId) {
    const s = new Set();
    for (const p of pointers) {
      if (p.id !== exceptId && p.nozzle != null) s.add(p.nozzle);
    }
    return s;
  }

  function nearestFreeNozzle(wx, wy, occupied) {
    let best = -1, bestD = Infinity;
    for (let i = 0; i < cfg.nozzleCount; i++) {
      if (occupied.has(i)) continue;
      const n = nozzleWorld(i);
      const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function upsertPointer(id, clientX, clientY, fromMouseButton) {
    const w = screenToWorld(clientX, clientY);
    let p = pointers.find(x => x.id === id);
    if (!p) {
      p = {
        id, x: w.x, y: w.y, active: true,
        nx: 0, ny: 0, fx: 0, fy: 0, flameX: 0, flameY: 0,
        nozzle: null, button: fromMouseButton,
      };
      pointers.push(p);
    } else {
      p.x = w.x; p.y = w.y; p.active = true;
    }
    // v4: rebind nearest free nozzle on every down/move (not locked to down)
    p.nozzle = nearestFreeNozzle(p.x, p.y, occupiedNozzles(id));
    if (p.nozzle < 0) p.nozzle = null;
    noteNozzleBind(id, p.nozzle, performance.now());
  }

  function rebindAllPointers() {
    // Stable order: clear then assign so multi-touch gets distinct nozzles
    const now = performance.now();
    for (const p of pointers) p.nozzle = null;
    for (const p of pointers) {
      p.nozzle = nearestFreeNozzle(p.x, p.y, occupiedNozzles(p.id));
      if (p.nozzle < 0) p.nozzle = null;
      noteNozzleBind(p.id, p.nozzle, now);
    }
  }

  function removePointer(id) {
    const now = performance.now();
    const prev = pointerNozzlePrev.has(id) ? pointerNozzlePrev.get(id) : null;
    if (prev != null) armNozzleCooldown(prev, now);
    pointers = pointers.filter(p => p.id !== id);
    pointerNozzlePrev.delete(id);
  }

  canvas.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0 && e.button !== 2) return;
    canvas.setPointerCapture(e.pointerId);
    const id = e.pointerType === "mouse" ? `mouse-${e.button}` : `t-${e.pointerId}`;
    upsertPointer(id, e.clientX, e.clientY, e.button);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") {
      let any = false;
      for (const p of pointers) {
        if (!p.id.startsWith("mouse-")) continue;
        const w = screenToWorld(e.clientX, e.clientY);
        p.x = w.x; p.y = w.y;
        any = true;
      }
      if (any) rebindAllPointers();
    } else {
      const id = `t-${e.pointerId}`;
      if (!pointers.some(p => p.id === id)) return;
      upsertPointer(id, e.clientX, e.clientY);
      rebindAllPointers();
    }
    e.preventDefault();
  }, { passive: false });

  function endPointer(e) {
    if (e.pointerType === "mouse") {
      removePointer(`mouse-${e.button}`);
    } else {
      removePointer(`t-${e.pointerId}`);
    }
    rebindAllPointers();
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", e => e.preventDefault());

  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") reset();
  });

  function applyThrustForces(dt) {
    const now = performance.now();
    const firings = [];
    const outOfFuel = fuel <= 0;

    for (const p of pointers) {
      // clear thrust viz each step; only set when actually firing
      p.fx = 0; p.fy = 0; p.flameX = 0; p.flameY = 0;
      if (p.nozzle == null) continue;
      const n = nozzleWorld(p.nozzle);
      p.nx = n.x; p.ny = n.y;
      if (outOfFuel) continue;
      if (now < nozzleReadyAt[p.nozzle]) continue; // cooling after spray/switch

      let dx = p.x - n.x;
      let dy = p.y - n.y;
      if (dx * dx + dy * dy < 1e-6) {
        const d = bodyDown();
        dx = d.x; dy = d.y;
      }
      const flame = clampAngle({ x: dx, y: dy }, cfg.maxAngleDeg);
      const fx = -flame.x * cfg.thrust;
      const fy = -flame.y * cfg.thrust;
      p.fx = fx; p.fy = fy;
      p.flameX = flame.x; p.flameY = flame.y;
      firings.push({ nozzle: p.nozzle, n, fx, fy, flameX: flame.x, flameY: flame.y });
    }

    // Burn fuel for nozzles that actually produced thrust this step
    if (firings.length && fuel > 0) {
      fuel = Math.max(0, fuel - cfg.fuelBurnPerSec * firings.length * dt);
    }

    let torqueScale = 1;
    if (firings.length >= 2) {
      torqueScale = 0.32;
      const a = firings[0], b = firings[1];
      const aimDot = a.flameX * b.flameX + a.flameY * b.flameY;
      if (aimDot > 0.65) torqueScale *= 0.45;
    } else if (firings.length === 1) {
      torqueScale = 0.55;
    }

    const I = (cfg.bodyW * cfg.bodyW + cfg.bodyH * cfg.bodyH) / 12 * 0.02;
    for (const f of firings) {
      craft.vx += f.fx * dt;
      craft.vy += f.fy * dt;
      const rx = f.n.x - craft.x;
      const ry = f.n.y - craft.y;
      const torque = rx * f.fy - ry * f.fx;
      craft.omega += (torque / Math.max(I, 1e-4)) * dt * cfg.torqueCoef * torqueScale;
    }
    craft.omega = Math.max(-cfg.omegaCap, Math.min(cfg.omegaCap, craft.omega));
    return firings.length;
  }

  function integrate(dt) {
    craft.vy += cfg.gravity * dt;
    craft.vx *= Math.max(0, 1 - cfg.linearDrag * dt);
    craft.vy *= Math.max(0, 1 - cfg.linearDrag * 0.35 * dt);
    craft.omega *= Math.max(0, 1 - cfg.angularDrag * dt);
    craft.omega = Math.max(-cfg.omegaCap, Math.min(cfg.omegaCap, craft.omega));

    craft.x += craft.vx * dt;
    craft.y += craft.vy * dt;
    craft.angle += craft.omega * dt;

    // Soft horizontal bounds (wide corridor)
    const bound = 2500;
    if (craft.x < -bound) { craft.x = -bound; craft.vx *= -0.3; }
    if (craft.x > bound) { craft.x = bound; craft.vx *= -0.3; }

    const halfW = cfg.bodyW / 2, halfH = cfg.bodyH / 2;
    const corners = [
      rot(-halfW, -halfH, craft.angle),
      rot(halfW, -halfH, craft.angle),
      rot(-halfW, halfH, craft.angle),
      rot(halfW, halfH, craft.angle),
    ];
    let maxPen = 0;
    for (const c of corners) {
      const wy = craft.y + c.y;
      const pen = wy - world.groundY;
      if (pen > maxPen) maxPen = pen;
    }
    if (maxPen > 0) {
      craft.y -= maxPen;
      if (craft.vy > 0) craft.vy *= -0.25;
      craft.vx *= 0.85;
      if (Math.abs(craft.vy) < 12 && Math.abs(craft.omega) < 1.2) {
        craft.vy = 0;
        craft.omega *= 0.5;
        craft.angle *= 0.85;
        if (Math.abs(craft.angle) < 0.03) craft.angle = 0;
      } else {
        craft.omega += -craft.angle * 2.5 * dt;
      }
    }
  }

  function updateCamera(dt) {
    const followX = craft.x;
    const followY = craft.y + world.h / 2 - playH * cfg.craftScreenFrac;
    const k = 1 - Math.exp(-cfg.camLerp * dt);
    cam.x += (followX - cam.x) * k;
    let camYTarget = followY;

    // Near ground: clamp so ground sits at top of control strip (not filling it / not sunk off-screen)
    const alt = altitude();
    if (alt < playH * 1.25) {
      const gsy = world.groundY - followY + world.h / 2;
      if (gsy > playH) {
        camYTarget = world.groundY + world.h / 2 - playH;
      }
    }
    cam.y += (camYTarget - cam.y) * k;
    if (alt < playH * 1.25) {
      const minCamY = world.groundY + world.h / 2 - playH;
      if (cam.y < minCamY) cam.y = minCamY;
    }
  }

  function wrapMod(v, m) {
    return ((v % m) + m) % m;
  }

  /** Multi-layer parallax sky — cam-driven, ground stays world-locked. */
  function drawParallax() {
    ctx.clearRect(0, 0, world.w, world.h);

    // Deep sky gradient (very far: almost no scroll, slight hue shift with altitude)
    const skyShift = wrapMod(cam.y * 0.008, world.h);
    const sky = ctx.createLinearGradient(0, -skyShift * 0.3, 0, world.h - skyShift * 0.3);
    sky.addColorStop(0, "#060b18");
    sky.addColorStop(0.35, "#0c1830");
    sky.addColorStop(0.7, "#152448");
    sky.addColorStop(1, "#1e2f55");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, world.w, world.h);

    const clipH = playH; // don't draw parallax into control strip

    // Layer 0 — far stars (slow)
    {
      const px = cam.x * 0.06, py = cam.y * 0.05;
      ctx.fillStyle = "#ffffff55";
      for (let i = 0; i < 70; i++) {
        const sx = wrapMod(i * 97 + 13 - px, world.w);
        const sy = wrapMod(i * 53 + 29 - py, Math.max(1, clipH));
        const s = (i % 5 === 0) ? 2.5 : 1.5;
        ctx.fillRect(sx, sy, s, s);
      }
    }

    // Layer 1 — mid starfield + vertical bands (clear horizontal drift)
    {
      const px = cam.x * 0.18, py = cam.y * 0.14;
      for (let i = 0; i < 8; i++) {
        const bx = wrapMod(i * (world.w / 5) - px * 0.6, world.w + 80) - 40;
        ctx.fillStyle = i % 2 ? "#1a2a4a44" : "#24365c55";
        ctx.fillRect(bx, 0, 48 + (i % 3) * 16, clipH);
      }
      ctx.fillStyle = "#c8d8ff66";
      for (let i = 0; i < 40; i++) {
        const sx = wrapMod(i * 137 + 41 - px, world.w);
        const sy = wrapMod(i * 89 + 17 - py, Math.max(1, clipH));
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2 + (i % 3) * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Layer 2 — cloud / haze bands (strong Y parallax — obvious during free-fall)
    {
      const px = cam.x * 0.32, py = cam.y * 0.28;
      const bandH = 56;
      for (let i = -2; i < Math.ceil(clipH / bandH) + 3; i++) {
        const by = wrapMod(i * bandH - py, clipH + bandH * 2) - bandH;
        if (by > clipH) continue;
        const alpha = 0.10 + (i & 1) * 0.06;
        ctx.fillStyle = `rgba(160,190,255,${alpha})`;
        ctx.fillRect(0, by, world.w, bandH * 0.55);
        // soft lumps
        ctx.fillStyle = `rgba(200,220,255,${alpha + 0.05})`;
        for (let j = 0; j < 5; j++) {
          const cx = wrapMod(j * 170 + i * 40 - px, world.w + 120) - 60;
          ctx.beginPath();
          ctx.ellipse(cx, by + bandH * 0.3, 55, 14, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Layer 3 — near mountains / jagged silhouettes (faster, still << 1)
    {
      const px = cam.x * 0.55, py = cam.y * 0.42;
      const baseY = clipH * 0.72 + wrapMod(-py * 0.15, 40) - 20;
      ctx.beginPath();
      ctx.moveTo(-20, clipH);
      const span = 160;
      for (let x = -span; x < world.w + span; x += span) {
        const wx = wrapMod(x - px, world.w + span * 2) - span;
        const peak = 50 + ((Math.sin((x + px) * 0.01) + 1) * 35) + ((x / span) % 3) * 12;
        ctx.lineTo(wx, baseY - peak);
        ctx.lineTo(wx + span * 0.5, baseY - peak * 0.35);
      }
      ctx.lineTo(world.w + 20, clipH);
      ctx.closePath();
      ctx.fillStyle = "#1a2740cc";
      ctx.fill();

      // nearer ridge (even faster lateral)
      const px2 = cam.x * 0.72, py2 = cam.y * 0.55;
      const baseY2 = clipH * 0.82 + wrapMod(-py2 * 0.12, 30) - 15;
      ctx.beginPath();
      ctx.moveTo(-20, clipH);
      for (let x = -120; x < world.w + 120; x += 120) {
        const wx = wrapMod(x - px2, world.w + 240) - 120;
        const peak = 28 + ((Math.cos((x + px2) * 0.014) + 1) * 22);
        ctx.lineTo(wx, baseY2 - peak);
        ctx.lineTo(wx + 60, baseY2 - peak * 0.4);
      }
      ctx.lineTo(world.w + 20, clipH);
      ctx.closePath();
      ctx.fillStyle = "#243552dd";
      ctx.fill();
    }

    // Layer 4 — near grid streaks (very obvious relative motion vs world ground)
    {
      const px = cam.x * 0.85, py = cam.y * 0.7;
      ctx.strokeStyle = "#6a8cc030";
      ctx.lineWidth = 1;
      const stepX = 48, stepY = 36;
      const ox = -wrapMod(px, stepX);
      const oy = -wrapMod(py, stepY);
      for (let x = ox; x < world.w; x += stepX) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, clipH);
        ctx.stroke();
      }
      ctx.strokeStyle = "#6a8cc022";
      for (let y = oy; y < clipH; y += stepY) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(world.w, y);
        ctx.stroke();
      }
    }
  }

  function draw() {
    drawParallax();

    // World transform: camera
    ctx.save();
    ctx.translate(-cam.x + world.w / 2, -cam.y + world.h / 2);

    // Ground plane (wide)
    const groundSpan = 8000;
    const gx0 = cam.x - groundSpan / 2;
    ctx.fillStyle = "#3a4a66";
    ctx.fillRect(gx0, world.groundY, groundSpan, 4000);
    ctx.fillStyle = "#5a6f94";
    ctx.fillRect(gx0, world.groundY, groundSpan, 4);
    ctx.fillStyle = "#8fb86a";
    ctx.fillRect(gx0, world.groundY, groundSpan, 2);
    // landing marks
    ctx.strokeStyle = "#ffffff18";
    ctx.lineWidth = 2;
    for (let x = Math.floor((cam.x - 2000) / 200) * 200; x < cam.x + 2000; x += 200) {
      ctx.beginPath();
      ctx.moveTo(x, world.groundY);
      ctx.lineTo(x, world.groundY + 28);
      ctx.stroke();
    }

    // Craft
    ctx.save();
    ctx.translate(craft.x, craft.y);
    ctx.rotate(craft.angle);
    ctx.fillStyle = "#f2f6ff";
    ctx.strokeStyle = "#6eb6ff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.rect(-cfg.bodyW / 2, -cfg.bodyH / 2, cfg.bodyW, cfg.bodyH);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#ff6b6b";
    ctx.fillRect(-8, -cfg.bodyH / 2, 16, 10);
    const nowDraw = performance.now();
    for (let i = 0; i < cfg.nozzleCount; i++) {
      const l = nozzleLocal(i);
      const bound = pointers.some(p => p.nozzle === i);
      const cooling = nowDraw < nozzleReadyAt[i];
      const thrusting = bound && !cooling && fuel > 0 && pointers.some(p => p.nozzle === i && (p.fx || p.fy));
      if (cooling) ctx.fillStyle = "#6a7080";
      else if (thrusting) ctx.fillStyle = "#ffdd66";
      else if (bound) ctx.fillStyle = "#ffb454";
      else ctx.fillStyle = "#c48a4a";
      ctx.beginPath();
      ctx.arc(l.x, l.y, thrusting ? 3.5 : 2.8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Thrust debug (world) — only when force applied (fuel + not cooling)
    for (const p of pointers) {
      if (p.nozzle == null) continue;
      if (!(p.fx || p.fy)) {
        // still show bind line faintly
        ctx.strokeStyle = "#ffffff33";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.nx, p.ny);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.fillStyle = "#ffffff44";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      const n = { x: p.nx, y: p.ny };
      const fl = 48;
      ctx.strokeStyle = "#ff9f43aa";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + p.flameX * fl, n.y + p.flameY * fl);
      ctx.stroke();
      ctx.strokeStyle = "#5eead4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + (p.fx / cfg.thrust) * 40, n.y + (p.fy / cfg.thrust) * 40);
      ctx.stroke();
      ctx.fillStyle = "#ffffff66";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff8";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    if (pointers.length) {
      const down = bodyDown();
      const maxRad = cfg.maxAngleDeg * Math.PI / 180;
      for (const p of pointers) {
        if (p.nozzle == null) continue;
        const n = nozzleWorld(p.nozzle);
        for (const sign of [-1, 1]) {
          const c = Math.cos(maxRad * sign), s = Math.sin(maxRad * sign);
          const dx = down.x * c - down.y * s;
          const dy = down.x * s + down.y * c;
          ctx.strokeStyle = "#ffffff22";
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(n.x + dx * 50, n.y + dy * 50);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    ctx.restore(); // end world

    // Control strip (screen space)
    ctx.fillStyle = "#0a1020cc";
    ctx.fillRect(0, playH, world.w, controlH);
    ctx.strokeStyle = "#4a6a9a88";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, playH);
    ctx.lineTo(world.w, playH);
    ctx.stroke();
    ctx.fillStyle = "#9eb6dccc";
    ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("喷气区 · 按住并拖动（全屏亦可）", world.w / 2, playH + 22);
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    const steps = 2;
    const h = dt / steps;
    for (let s = 0; s < steps; s++) {
      applyThrustForces(h);
      integrate(h);
    }
    updateCamera(dt);

    const alt = Math.max(0, altitude());
    const spd = Math.hypot(craft.vx, craft.vy);
    const deg = (craft.angle * 180 / Math.PI).toFixed(0);
    const fuelPct = Math.max(0, Math.min(100, fuel));
    altEl.textContent = `高度 ${alt.toFixed(0)} m`;
    fuelEl.classList.toggle("low", fuelPct <= 25);
    fuelEl.innerHTML = `燃料 ${fuelPct.toFixed(0)}%<span class="bar"><i style="transform:scaleX(${(fuelPct / 100).toFixed(3)})"></i></span>`;
    const firingN = pointers.filter(p => p.nozzle != null && (p.fx || p.fy)).length;
    const boundN = pointers.filter(p => p.nozzle != null).length;
    let status = `喷 ${firingN}/${boundN}/${cfg.nozzleCount} · 倾角 ${deg}° · 速 ${spd.toFixed(0)}`;
    if (fuel <= 0) status += " · 燃料耗尽";
    else status += ` · 偏角≤${cfg.maxAngleDeg}°`;
    statEl.textContent = status;
    draw();
    requestAnimationFrame(frame);
  }

  bindParams();
  resize();
  reset();
  window.addEventListener("resize", () => { resize(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => { resize(); });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

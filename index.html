<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Thrust Land Proto — 按住调姿→落地</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0b1020;
    font-family: ui-sans-serif, system-ui, "PingFang SC", "Noto Sans SC", sans-serif; color: #e8eefc;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    position: fixed; inset: 0; z-index: 0; display: block; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #hud {
    position: fixed; left: 12px; top: 12px; right: 150px;
    pointer-events: none; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    font-size: 13px; line-height: 1.35; opacity: 0.92;
    text-shadow: 0 1px 2px #000a;
  }
  #hud b { color: #8ec5ff; font-weight: 600; }
  #alt {
    font-variant-numeric: tabular-nums;
    color: #b8f0c8;
  }
  #fuel {
    font-variant-numeric: tabular-nums;
    color: #ffd28a;
    min-width: 140px;
  }
  #fuel .bar {
    display: inline-block; vertical-align: middle;
    width: 72px; height: 8px; margin-left: 6px;
    border-radius: 4px; background: #243048; overflow: hidden;
    border: 1px solid #4a5a78;
  }
  #fuel .bar > i {
    display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg, #e8a23a, #ffe08a);
    transform-origin: left center;
  }
  #fuel.low { color: #ff8a8a; }
  #fuel.low .bar > i { background: linear-gradient(90deg, #c04040, #ff8888); }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 2; pointer-events: none;
    background: #111a2ecc; border: 1px solid #335; border-radius: 10px;
    padding: 8px 14px; font-size: 12px; max-width: min(92vw, 520px);
    text-align: center; color: #c9d4ee;
  }
  #minimap {
    position: fixed; right: 12px; top: 12px; z-index: 3;
    width: 128px; height: 128px; pointer-events: none;
    background: #0e1628ee; border: 1px solid #4a6a9aaa; border-radius: 10px;
    box-shadow: 0 2px 10px #0008;
    overflow: hidden;
  }
  #minimap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #minimap .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    font-size: 10px; text-align: center; color: #9eb6dc;
    background: #0a1220cc; padding: 2px 0; letter-spacing: 0.02em;
  }
  #controls {
    position: fixed; right: 12px; top: 148px; z-index: 3;
    width: 128px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: auto;
  }
  #controls .craftRow { display: flex; gap: 4px; }
  #controls button {
    flex: 1; padding: 7px 4px; border-radius: 8px;
    border: 1px solid #456; background: #162033; color: #b8c8e0;
    font-size: 11px; cursor: pointer;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  #controls button.active {
    border-color: #6eb6ff; background: #1e3a5c; color: #e8f2ff; font-weight: 600;
  }
  #controls button:hover { background: #243656; }
  #controls #resetBtn {
    flex: none; width: 100%;
    border-color: #4a6; background: #1a3a28; color: #dfffe8;
  }
  #controls #resetBtn:hover { background: #234e35; }
</style>
</head>
<body>
<div id="hud">
  <span><b>Thrust Land</b> · 手感原型 <b>v14</b></span>
  <span id="craftLabel">机体 方块排喷</span>
  <span id="alt">高度 — m</span>
  <span id="fuel">燃料 —</span>
  <span id="stat">就绪</span>
</div>
<div id="minimap" aria-label="地面小地图">
  <canvas id="mm" width="128" height="128"></canvas>
  <div class="cap">地面 · 落点</div>
</div>
<div id="controls" aria-label="机体与复位">
  <div class="craftRow">
    <button type="button" id="craftRect" class="active">方块·多喷口</button>
    <button type="button" id="craftRocket">细长·单喷口</button>
  </div>
  <button id="resetBtn" type="button">重置 (R)</button>
</div>
<div id="hint">单指按住：指在机体下方喷底、上方喷顶（反向推力/调姿）· 右上切换机体 · 键 <b>1</b>/<b>2</b>/<b>R</b> · 燃料有限 · 小地图对准落点 · 开局约 3000 m 随机倾角</div>
<canvas id="c"></canvas>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const mmCanvas = document.getElementById("mm");
  const mmCtx = mmCanvas.getContext("2d");
  const statEl = document.getElementById("stat");
  const altEl = document.getElementById("alt");
  const fuelEl = document.getElementById("fuel");
  const craftLabelEl = document.getElementById("craftLabel");
  const craftRectBtn = document.getElementById("craftRect");
  const craftRocketBtn = document.getElementById("craftRocket");
  const resetBtn = document.getElementById("resetBtn");

  // World units: 1 unit ≈ 1 m. +Y is down (canvas-like). Ground at y = 0.
  const CRAFTS = {
    rect: {
      id: "rect",
      label: "方块排喷",
      bodyW: 56,
      bodyH: 96,
      nozzleCount: 9,
      topNozzleCount: 5,
      nozzleMarginX: 6,
      nozzleY: 0.48,
      shape: "rect",
    },
    rocket: {
      id: "rocket",
      label: "细长火箭",
      bodyW: 28,
      bodyH: 120,
      nozzleCount: 1,
      topNozzleCount: 1,
      nozzleMarginX: 0,
      nozzleY: 0.48,
      shape: "rocket",
    },
  };

  const cfg = {
    thrust: 90,
    maxAngleDeg: 60,
    gravity: 55,
    linearDrag: 0.35,
    angularDrag: 8,
    torqueCoef: 0.011,
    omegaCap: 2.2,
    bodyW: CRAFTS.rect.bodyW,
    bodyH: CRAFTS.rect.bodyH,
    nozzleCount: CRAFTS.rect.nozzleCount,
    topNozzleCount: CRAFTS.rect.topNozzleCount,
    nozzleMarginX: CRAFTS.rect.nozzleMarginX,
    nozzleY: CRAFTS.rect.nozzleY,
    spawnAltitude: 3000,
    camLerp: 6,
    craftScreenFrac: 0.36,
    // v14: top nozzles + finger side→bank (above=top / below=bottom)
    // v13: restore on-screen craft switch + reset buttons (no params sliders)
    // v12: free-fall accel along body long axis (tilt → diagonal fall);
    // restore v10 screen-space thrust aim (not v11 body-axis+gimbal as main)
    // keep v7–v10: single finger, no cooldown, screen coords, simple sky, streaks,
    // continuous cam, minimap, fuel, tilt spawn, no select
    fuelMax: 100,
    fuelBurnPerSec: 7.5,
    spawnTiltMinDeg: 15,
    spawnTiltMaxDeg: 45,
    padX: 0,
    padHalfW: 90,
    minimapRange: 420,
  };

  let craftType = "rect";

  const world = { w: 800, h: 600, groundY: 0 };
  const cam = { x: 0, y: 0 };
  let controlH = 160;
  let playH = 440;

  const craft = {
    x: 0, y: 0, vx: 0, vy: 0, angle: 0, omega: 0,
  };

  let fuel = cfg.fuelMax;

  /** @type {{id:string,sx:number,sy:number,x:number,y:number,active:boolean,nx:number,ny:number,fx:number,fy:number,flameX:number,flameY:number,nozzle:number|null,button?:number}[]} */
  let pointers = [];

  function applyCraftType(type, doReset) {
    const def = CRAFTS[type] || CRAFTS.rect;
    craftType = def.id;
    cfg.bodyW = def.bodyW;
    cfg.bodyH = def.bodyH;
    cfg.nozzleCount = def.nozzleCount;
    cfg.topNozzleCount = def.topNozzleCount;
    cfg.nozzleMarginX = def.nozzleMarginX;
    cfg.nozzleY = def.nozzleY;
    craftLabelEl.textContent = "机体 " + def.label;
    craftRectBtn.classList.toggle("active", craftType === "rect");
    craftRocketBtn.classList.toggle("active", craftType === "rocket");
    if (doReset) reset();
  }

  function bindControls() {
    resetBtn.addEventListener("click", (e) => { e.preventDefault(); reset(); });
    craftRectBtn.addEventListener("click", (e) => { e.preventDefault(); applyCraftType("rect", true); });
    craftRocketBtn.addEventListener("click", (e) => { e.preventDefault(); applyCraftType("rocket", true); });
    // keep canvas from seeing pointer on the control cluster
    const box = document.getElementById("controls");
    for (const ev of ["pointerdown", "pointerup", "pointermove", "touchstart", "mousedown", "contextmenu"]) {
      box.addEventListener(ev, (e) => { e.stopPropagation(); }, { capture: true });
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vv = window.visualViewport;
    world.w = vv ? vv.width : window.innerWidth;
    world.h = vv ? vv.height : window.innerHeight;
    canvas.width = Math.floor(world.w * dpr);
    canvas.height = Math.floor(world.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    controlH = Math.max(140, Math.round(world.h * 0.25));
    playH = world.h - controlH;
  }

  function randomSpawnTilt() {
    const min = cfg.spawnTiltMinDeg;
    const max = cfg.spawnTiltMaxDeg;
    const deg = min + Math.random() * (max - min);
    const sign = Math.random() < 0.5 ? -1 : 1;
    return sign * deg * Math.PI / 180;
  }

  function reset() {
    craft.x = 0;
    craft.y = world.groundY - cfg.spawnAltitude - cfg.bodyH / 2;
    craft.vx = 0;
    craft.vy = 0;
    craft.angle = randomSpawnTilt();
    craft.omega = 0;
    fuel = cfg.fuelMax;
    pointers = [];
    cam.x = craft.x;
    cam.y = craft.y + world.h / 2 - playH * cfg.craftScreenFrac;
    const deg = (craft.angle * 180 / Math.PI).toFixed(0);
    const name = (CRAFTS[craftType] || CRAFTS.rect).label;
    statEl.textContent = `已复位 · ${name} · 倾角 ${deg}° · 燃料满`;
  }

  function rot(lx, ly, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    return { x: lx * c - ly * s, y: lx * s + ly * c };
  }

  function totalNozzles() {
    return cfg.nozzleCount + cfg.topNozzleCount;
  }

  function nozzleLocal(i) {
    const botN = cfg.nozzleCount;
    const half = cfg.bodyW / 2;
    const left = -half + cfg.nozzleMarginX;
    const right = half - cfg.nozzleMarginX;
    if (i < botN) {
      const n = botN;
      const t = n <= 1 ? 0.5 : i / (n - 1);
      return { x: left + (right - left) * t, y: cfg.bodyH * cfg.nozzleY, bank: "bottom" };
    }
    const j = i - botN;
    const n = cfg.topNozzleCount;
    const t = n <= 1 ? 0.5 : j / (n - 1);
    return { x: left + (right - left) * t, y: -cfg.bodyH * cfg.nozzleY, bank: "top" };
  }

  function nozzleWorld(i) {
    const l = nozzleLocal(i);
    const r = rot(l.x, l.y, craft.angle);
    return { x: craft.x + r.x, y: craft.y + r.y, bank: l.bank };
  }

  function bodyDown() {
    return rot(0, 1, craft.angle);
  }

  function bodyUp() {
    const d = bodyDown();
    return { x: -d.x, y: -d.y };
  }

  /** Finger on body +Y (tail) side → bottom bank; nose side → top bank. */
  function preferredBank(wx, wy) {
    const dx = wx - craft.x;
    const dy = wy - craft.y;
    const c = Math.cos(craft.angle), s = Math.sin(craft.angle);
    // inverse of rot: ly = -dx*s + dy*c  (+Y is body-down / engines)
    const ly = -dx * s + dy * c;
    return ly >= 0 ? "bottom" : "top";
  }

  function craftLowestY() {
    const halfW = cfg.bodyW / 2, halfH = cfg.bodyH / 2;
    let maxY = -Infinity;
    const corners = [
      [-halfW, -halfH], [halfW, -halfH],
      [-halfW, halfH], [halfW, halfH],
    ];
    // rocket tip/fins roughly covered by rect AABB; OK for altitude
    for (const [lx, ly] of corners) {
      const r = rot(lx, ly, craft.angle);
      const wy = craft.y + r.y;
      if (wy > maxY) maxY = wy;
    }
    return maxY;
  }

  function altitude() {
    return world.groundY - craftLowestY();
  }

  function clampAngle(vec, maxDeg, axis) {
    const down = axis || bodyDown();
    const maxRad = maxDeg * Math.PI / 180;
    let vx = vec.x, vy = vec.y;
    const len = Math.hypot(vx, vy) || 1;
    vx /= len; vy /= len;
    const cross = down.x * vy - down.y * vx;
    const dot = down.x * vx + down.y * vy;
    let ang = Math.atan2(cross, dot);
    if (ang > maxRad) ang = maxRad;
    if (ang < -maxRad) ang = -maxRad;
    const c = Math.cos(ang), s = Math.sin(ang);
    return {
      x: down.x * c - down.y * s,
      y: down.x * s + down.y * c,
    };
  }

  /** Canvas CSS-pixel coords from client (independent of camera / world fall). */
  function clientToScreen(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      sx: (clientX - rect.left) * (world.w / rect.width),
      sy: (clientY - rect.top) * (world.h / rect.height),
    };
  }

  /** Screen → world using *current* camera (must refresh every frame while held). */
  function screenToWorld(sx, sy) {
    return {
      x: sx + cam.x - world.w / 2,
      y: sy + cam.y - world.h / 2,
    };
  }

  function syncPointerWorld(p) {
    const w = screenToWorld(p.sx, p.sy);
    p.x = w.x;
    p.y = w.y;
  }

  function syncAllPointersWorld() {
    for (const p of pointers) syncPointerWorld(p);
  }

  function occupiedNozzles(exceptId) {
    const s = new Set();
    for (const p of pointers) {
      if (p.id !== exceptId && p.nozzle != null) s.add(p.nozzle);
    }
    return s;
  }

  function nearestFreeNozzle(wx, wy, occupied) {
    const bank = preferredBank(wx, wy);
    const total = totalNozzles();
    let best = -1, bestD = Infinity;
    for (let i = 0; i < total; i++) {
      if (occupied.has(i)) continue;
      if (nozzleLocal(i).bank !== bank) continue;
      const n = nozzleWorld(i);
      const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) return best;
    // fallback: any free nozzle (other bank)
    for (let i = 0; i < total; i++) {
      if (occupied.has(i)) continue;
      const n = nozzleWorld(i);
      const d = (n.x - wx) ** 2 + (n.y - wy) ** 2;
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function upsertPointer(id, clientX, clientY, fromMouseButton) {
    const s = clientToScreen(clientX, clientY);
    let p = pointers.find(x => x.id === id);
    if (!p) {
      p = {
        id, sx: s.sx, sy: s.sy, x: 0, y: 0, active: true,
        nx: 0, ny: 0, fx: 0, fy: 0, flameX: 0, flameY: 0,
        nozzle: null, button: fromMouseButton,
      };
      pointers.push(p);
    } else {
      p.sx = s.sx; p.sy = s.sy; p.active = true;
    }
    syncPointerWorld(p);
    p.nozzle = nearestFreeNozzle(p.x, p.y, occupiedNozzles(id));
    if (p.nozzle < 0) p.nozzle = null;
  }

  function rebindActivePointer() {
    for (const p of pointers) {
      p.nozzle = nearestFreeNozzle(p.x, p.y, occupiedNozzles(p.id));
      if (p.nozzle < 0) p.nozzle = null;
    }
  }

  function removePointer(id) {
    pointers = pointers.filter(p => p.id !== id);
  }

  canvas.addEventListener("pointerdown", (e) => {
    // v7: single finger / left mouse only; ignore 2nd finger & right button
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pointers.length >= 1) return;
    canvas.setPointerCapture(e.pointerId);
    const id = e.pointerType === "mouse" ? "mouse-0" : `t-${e.pointerId}`;
    upsertPointer(id, e.clientX, e.clientY, e.button);
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse") {
      const p = pointers.find(x => x.id === "mouse-0");
      if (!p) return;
      const s = clientToScreen(e.clientX, e.clientY);
      p.sx = s.sx; p.sy = s.sy;
      syncPointerWorld(p);
      rebindActivePointer();
    } else {
      const id = `t-${e.pointerId}`;
      if (!pointers.some(p => p.id === id)) return;
      upsertPointer(id, e.clientX, e.clientY);
    }
    e.preventDefault();
  }, { passive: false });

  function endPointer(e) {
    if (e.pointerType === "mouse") {
      if (e.button !== 0) return;
      removePointer("mouse-0");
    } else {
      removePointer(`t-${e.pointerId}`);
    }
  }
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  canvas.addEventListener("contextmenu", e => e.preventDefault());
  // v8: block long-press select / iOS callout on game surface
  document.addEventListener("contextmenu", (e) => { e.preventDefault(); });
  document.addEventListener("selectstart", (e) => { e.preventDefault(); });

  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") reset();
    if (e.key === "1") applyCraftType("rect", true);
    if (e.key === "2") applyCraftType("rocket", true);
  });

  function applyThrustForces(dt) {
    const firings = [];
    const outOfFuel = fuel <= 0;

    // v9: re-project held finger from fixed screen pixel → current world each frame
    // so camera follow / free-fall cannot drift thrust aim relative to the craft on screen.
    syncAllPointersWorld();

    for (const p of pointers) {
      p.fx = 0; p.fy = 0; p.flameX = 0; p.flameY = 0;
      if (p.nozzle == null) continue;
      const n = nozzleWorld(p.nozzle);
      p.nx = n.x; p.ny = n.y;
      if (outOfFuel) continue;

      // v12 / v10: screen-space aim; cone around body-down (bottom) or body-up (top)
      const bank = n.bank || nozzleLocal(p.nozzle).bank;
      const axis = bank === "top" ? bodyUp() : bodyDown();
      let dx = p.x - n.x;
      let dy = p.y - n.y;
      if (dx * dx + dy * dy < 1e-6) {
        dx = axis.x; dy = axis.y;
      }
      const flame = clampAngle({ x: dx, y: dy }, cfg.maxAngleDeg, axis);
      const fx = -flame.x * cfg.thrust;
      const fy = -flame.y * cfg.thrust;
      p.fx = fx; p.fy = fy;
      p.flameX = flame.x; p.flameY = flame.y;
      firings.push({ nozzle: p.nozzle, n, fx, fy, flameX: flame.x, flameY: flame.y });
    }

    if (firings.length && fuel > 0) {
      fuel = Math.max(0, fuel - cfg.fuelBurnPerSec * firings.length * dt);
    }

    const torqueScale = firings.length === 1 ? 0.55 : 1;
    const I = (cfg.bodyW * cfg.bodyW + cfg.bodyH * cfg.bodyH) / 12 * 0.02;
    for (const f of firings) {
      craft.vx += f.fx * dt;
      craft.vy += f.fy * dt;
      const rx = f.n.x - craft.x;
      const ry = f.n.y - craft.y;
      const torque = rx * f.fy - ry * f.fx;
      craft.omega += (torque / Math.max(I, 1e-4)) * dt * cfg.torqueCoef * torqueScale;
    }
    craft.omega = Math.max(-cfg.omegaCap, Math.min(cfg.omegaCap, craft.omega));
    return firings.length;
  }

  function integrate(dt) {
    // v12: free-fall accel follows body longitudinal axis (attitude drives fall direction)
    const gDir = bodyDown();
    craft.vx += gDir.x * cfg.gravity * dt;
    craft.vy += gDir.y * cfg.gravity * dt;
    craft.vx *= Math.max(0, 1 - cfg.linearDrag * dt);
    craft.vy *= Math.max(0, 1 - cfg.linearDrag * 0.35 * dt);
    craft.omega *= Math.max(0, 1 - cfg.angularDrag * dt);
    craft.omega = Math.max(-cfg.omegaCap, Math.min(cfg.omegaCap, craft.omega));

    craft.x += craft.vx * dt;
    craft.y += craft.vy * dt;
    craft.angle += craft.omega * dt;

    const bound = 2500;
    if (craft.x < -bound) { craft.x = -bound; craft.vx *= -0.3; }
    if (craft.x > bound) { craft.x = bound; craft.vx *= -0.3; }

    const halfW = cfg.bodyW / 2, halfH = cfg.bodyH / 2;
    const corners = [
      rot(-halfW, -halfH, craft.angle),
      rot(halfW, -halfH, craft.angle),
      rot(-halfW, halfH, craft.angle),
      rot(halfW, halfH, craft.angle),
    ];
    let maxPen = 0;
    for (const c of corners) {
      const wy = craft.y + c.y;
      const pen = wy - world.groundY;
      if (pen > maxPen) maxPen = pen;
    }
    if (maxPen > 0) {
      craft.y -= maxPen;
      if (craft.vy > 0) craft.vy *= -0.25;
      craft.vx *= 0.85;
      if (Math.abs(craft.vy) < 12 && Math.abs(craft.omega) < 1.2) {
        craft.vy = 0;
        craft.omega *= 0.5;
        craft.angle *= 0.85;
        if (Math.abs(craft.angle) < 0.03) craft.angle = 0;
      } else {
        craft.omega += -craft.angle * 2.5 * dt;
      }
    }
  }

  function updateCamera(dt) {
    // v10: one continuous follow shot — never hard-cut / lock to ground framing on land
    const followX = craft.x;
    const followY = craft.y + world.h / 2 - playH * cfg.craftScreenFrac;
    const k = 1 - Math.exp(-cfg.camLerp * dt);
    cam.x += (followX - cam.x) * k;
    cam.y += (followY - cam.y) * k;
  }

  function drawSimpleSky() {
    // v9: restore pre-parallax look (v4-style) — no multi-layer parallax (avoids flicker)
    ctx.clearRect(0, 0, world.w, world.h);
    const sky = ctx.createLinearGradient(0, 0, 0, world.h);
    sky.addColorStop(0, "#0a1428");
    sky.addColorStop(0.55, "#141c33");
    sky.addColorStop(1, "#1a2238");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, world.w, world.h);

    ctx.fillStyle = "#ffffff22";
    for (let i = 0; i < 50; i++) {
      const sx = (i * 97 + 13 + Math.floor(cam.x * 0.02)) % world.w;
      const sy = (i * 53 + 29) % Math.max(1, playH);
      if (sy < playH - 4) ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function drawSpeedStreaks() {
    // v9: a few airflow lines from the craft tail, length ~ speed
    const spd = Math.hypot(craft.vx, craft.vy);
    if (spd < 12) return;
    const ux = craft.vx / spd;
    const uy = craft.vy / spd;
    // rear tip in world (body +Y is down / engine end)
    const rear = rot(0, cfg.bodyH * 0.48, craft.angle);
    const rx = craft.x + rear.x;
    const ry = craft.y + rear.y;
    const len = Math.min(90, 14 + spd * 0.28);
    const count = 5;
    for (let i = 0; i < count; i++) {
      const t = i / (count - 1);
      const side = (t - 0.5) * cfg.bodyW * 0.85;
      const off = rot(side, 0, craft.angle);
      const ox = rx + off.x;
      const oy = ry + off.y;
      const jitter = ((i * 37) % 7) - 3;
      const a = 0.12 + 0.28 * (1 - Math.abs(t - 0.5) * 1.4);
      ctx.strokeStyle = `rgba(190,220,255,${a.toFixed(3)})`;
      ctx.lineWidth = 1.2 + (i % 2) * 0.4;
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ox - ux * (len + jitter), oy - uy * (len + jitter));
      ctx.stroke();
    }
  }

  function drawLandingPad() {
    const px = cfg.padX;
    const half = cfg.padHalfW;
    const gy = world.groundY;
    ctx.fillStyle = "#2a3a28";
    ctx.fillRect(px - half, gy - 2, half * 2, 6);
    ctx.strokeStyle = "#8fd98f";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - half, gy);
    ctx.lineTo(px + half, gy);
    ctx.stroke();
    // H marks
    ctx.strokeStyle = "#c8f0c8aa";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - 18, gy - 1);
    ctx.lineTo(px - 18, gy - 22);
    ctx.moveTo(px + 18, gy - 1);
    ctx.lineTo(px + 18, gy - 22);
    ctx.moveTo(px - 18, gy - 12);
    ctx.lineTo(px + 18, gy - 12);
    ctx.stroke();
    ctx.fillStyle = "#9ee09e88";
    ctx.beginPath();
    ctx.arc(px, gy - 1, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawMinimap() {
    const s = mmCanvas.width;
    const range = cfg.minimapRange;
    const cx = s / 2, cy = s / 2 - 6;
    mmCtx.clearRect(0, 0, s, s);
    // ground plane tint
    mmCtx.fillStyle = "#152033";
    mmCtx.fillRect(0, 0, s, s);
    mmCtx.fillStyle = "#1e2e22";
    mmCtx.beginPath();
    mmCtx.arc(cx, cy, s * 0.42, 0, Math.PI * 2);
    mmCtx.fill();
    mmCtx.strokeStyle = "#3a5a48";
    mmCtx.lineWidth = 1;
    mmCtx.stroke();

    // grid
    mmCtx.strokeStyle = "#ffffff10";
    mmCtx.lineWidth = 1;
    for (let i = -2; i <= 2; i++) {
      const o = (i / 2) * (s * 0.38);
      mmCtx.beginPath();
      mmCtx.moveTo(cx + o, cy - s * 0.38);
      mmCtx.lineTo(cx + o, cy + s * 0.38);
      mmCtx.stroke();
      mmCtx.beginPath();
      mmCtx.moveTo(cx - s * 0.38, cy + o);
      mmCtx.lineTo(cx + s * 0.38, cy + o);
      mmCtx.stroke();
    }

    function toMap(wx, wz) {
      // top-down: world X → map X; fake Z from craft heading/speed unused — keep pad-centered plane
      return {
        x: cx + (wx - cfg.padX) / range * (s * 0.38),
        y: cy + wz / range * (s * 0.38),
      };
    }

    // pad / landing target
    const pad = toMap(cfg.padX, 0);
    mmCtx.strokeStyle = "#8fd98f";
    mmCtx.fillStyle = "#8fd98f33";
    mmCtx.lineWidth = 1.5;
    const padR = Math.max(6, cfg.padHalfW / range * (s * 0.38));
    mmCtx.beginPath();
    mmCtx.arc(pad.x, pad.y, padR, 0, Math.PI * 2);
    mmCtx.fill();
    mmCtx.stroke();
    mmCtx.beginPath();
    mmCtx.moveTo(pad.x - padR - 3, pad.y);
    mmCtx.lineTo(pad.x + padR + 3, pad.y);
    mmCtx.moveTo(pad.x, pad.y - padR - 3);
    mmCtx.lineTo(pad.x, pad.y + padR + 3);
    mmCtx.stroke();

    // rocket horizontal projection (use craft.x; slight Z from lateral vel for readability)
    const rz = Math.max(-range * 0.85, Math.min(range * 0.85, craft.vx * 0.35));
    let rm = toMap(craft.x, rz);
    // clamp into ring if far
    const dx = rm.x - cx, dy = rm.y - cy;
    const d = Math.hypot(dx, dy);
    const maxD = s * 0.40;
    if (d > maxD) {
      rm = { x: cx + dx / d * maxD, y: cy + dy / d * maxD };
    }
    // heading tick
    const ang = craft.angle;
    mmCtx.save();
    mmCtx.translate(rm.x, rm.y);
    mmCtx.rotate(ang);
    mmCtx.fillStyle = "#ffdd66";
    mmCtx.strokeStyle = "#fff";
    mmCtx.lineWidth = 1;
    mmCtx.beginPath();
    mmCtx.moveTo(0, -7);
    mmCtx.lineTo(4.5, 6);
    mmCtx.lineTo(0, 3.5);
    mmCtx.lineTo(-4.5, 6);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.stroke();
    mmCtx.restore();

    // connector line pad → rocket
    mmCtx.strokeStyle = "#ffffff28";
    mmCtx.setLineDash([3, 3]);
    mmCtx.beginPath();
    mmCtx.moveTo(pad.x, pad.y);
    mmCtx.lineTo(rm.x, rm.y);
    mmCtx.stroke();
    mmCtx.setLineDash([]);

    // lateral offset readout (above HTML caption strip)
    const dxm = craft.x - cfg.padX;
    mmCtx.fillStyle = "#c8e0ff";
    mmCtx.font = "10px ui-sans-serif, system-ui, sans-serif";
    mmCtx.textAlign = "center";
    mmCtx.fillText(`Δx ${dxm >= 0 ? "+" : ""}${dxm.toFixed(0)}m`, cx, 12);
  }

  function drawCraftBody() {
    ctx.save();
    ctx.translate(craft.x, craft.y);
    ctx.rotate(craft.angle);
    const halfW = cfg.bodyW / 2, halfH = cfg.bodyH / 2;
    const shape = (CRAFTS[craftType] || CRAFTS.rect).shape;

    if (shape === "rocket") {
      // slim rocket: nose cone + body + fins
      ctx.fillStyle = "#f2f6ff";
      ctx.strokeStyle = "#6eb6ff";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, -halfH);
      ctx.lineTo(halfW * 0.85, -halfH + halfW * 1.6);
      ctx.lineTo(halfW * 0.85, halfH - 10);
      ctx.lineTo(-halfW * 0.85, halfH - 10);
      ctx.lineTo(-halfW * 0.85, -halfH + halfW * 1.6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // nose accent
      ctx.fillStyle = "#ff6b6b";
      ctx.beginPath();
      ctx.moveTo(0, -halfH);
      ctx.lineTo(halfW * 0.55, -halfH + halfW * 1.1);
      ctx.lineTo(-halfW * 0.55, -halfH + halfW * 1.1);
      ctx.closePath();
      ctx.fill();
      // fins
      ctx.fillStyle = "#c8d8f0";
      ctx.strokeStyle = "#6eb6ff";
      ctx.beginPath();
      ctx.moveTo(-halfW * 0.85, halfH - 28);
      ctx.lineTo(-halfW * 1.55, halfH - 4);
      ctx.lineTo(-halfW * 0.85, halfH - 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(halfW * 0.85, halfH - 28);
      ctx.lineTo(halfW * 1.55, halfH - 4);
      ctx.lineTo(halfW * 0.85, halfH - 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // engine bell hint (bottom)
      ctx.fillStyle = "#8a9ab8";
      ctx.fillRect(-halfW * 0.45, halfH - 10, halfW * 0.9, 8);
      // top thruster ring (nose)
      ctx.fillStyle = "#8a9ab8";
      ctx.fillRect(-halfW * 0.35, -halfH + 2, halfW * 0.7, 5);
    } else {
      ctx.fillStyle = "#f2f6ff";
      ctx.strokeStyle = "#6eb6ff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.rect(-halfW, -halfH, cfg.bodyW, cfg.bodyH);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#ff6b6b";
      ctx.fillRect(-8, -halfH, 16, 10);
    }

    // top accent thruster strip for rect craft
    if (shape === "rect") {
      ctx.fillStyle = "#8a9ab8";
      ctx.fillRect(-halfW * 0.55, -halfH, halfW * 1.1, 4);
    }

    const total = totalNozzles();
    for (let i = 0; i < total; i++) {
      const l = nozzleLocal(i);
      const bound = pointers.some(p => p.nozzle === i);
      const thrusting = bound && fuel > 0 && pointers.some(p => p.nozzle === i && (p.fx || p.fy));
      if (thrusting) ctx.fillStyle = l.bank === "top" ? "#66e0ff" : "#ffdd66";
      else if (bound) ctx.fillStyle = l.bank === "top" ? "#54c0ff" : "#ffb454";
      else ctx.fillStyle = l.bank === "top" ? "#4a8ac4" : "#c48a4a";
      const r0 = (l.bank === "bottom" ? cfg.nozzleCount : cfg.topNozzleCount) === 1 ? 3.8 : 2.8;
      ctx.beginPath();
      ctx.arc(l.x, l.y, thrusting ? 4 : r0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function draw() {
    drawSimpleSky();

    ctx.save();
    ctx.translate(-cam.x + world.w / 2, -cam.y + world.h / 2);

    const groundSpan = 8000;
    const gx0 = cam.x - groundSpan / 2;
    ctx.fillStyle = "#3a4a66";
    ctx.fillRect(gx0, world.groundY, groundSpan, 4000);
    ctx.fillStyle = "#5a6f94";
    ctx.fillRect(gx0, world.groundY, groundSpan, 4);
    ctx.fillStyle = "#8fb86a";
    ctx.fillRect(gx0, world.groundY, groundSpan, 2);
    ctx.strokeStyle = "#ffffff18";
    ctx.lineWidth = 2;
    for (let x = Math.floor((cam.x - 2000) / 200) * 200; x < cam.x + 2000; x += 200) {
      ctx.beginPath();
      ctx.moveTo(x, world.groundY);
      ctx.lineTo(x, world.groundY + 28);
      ctx.stroke();
    }

    drawLandingPad();
    drawCraftBody();
    drawSpeedStreaks();

    for (const p of pointers) {
      if (p.nozzle == null) continue;
      if (!(p.fx || p.fy)) {
        ctx.strokeStyle = "#ffffff33";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.nx, p.ny);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.fillStyle = "#ffffff44";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      const n = { x: p.nx, y: p.ny };
      const fl = 48;
      const isTop = (p.nozzle != null) && nozzleLocal(p.nozzle).bank === "top";
      ctx.strokeStyle = isTop ? "#43c8ffaa" : "#ff9f43aa";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + p.flameX * fl, n.y + p.flameY * fl);
      ctx.stroke();
      ctx.strokeStyle = isTop ? "#a5f3fc" : "#5eead4";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(n.x + (p.fx / cfg.thrust) * 40, n.y + (p.fy / cfg.thrust) * 40);
      ctx.stroke();
      ctx.fillStyle = "#ffffff66";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fff8";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(n.x, n.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }

    if (pointers.length) {
      const maxRad = cfg.maxAngleDeg * Math.PI / 180;
      for (const p of pointers) {
        if (p.nozzle == null) continue;
        const n = nozzleWorld(p.nozzle);
        const axis = n.bank === "top" ? bodyUp() : bodyDown();
        for (const sign of [-1, 1]) {
          const c = Math.cos(maxRad * sign), s = Math.sin(maxRad * sign);
          const dx = axis.x * c - axis.y * s;
          const dy = axis.x * s + axis.y * c;
          ctx.strokeStyle = n.bank === "top" ? "#66e0ff22" : "#ffffff22";
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(n.x, n.y);
          ctx.lineTo(n.x + dx * 50, n.y + dy * 50);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    }

    ctx.restore();

    ctx.fillStyle = "#0a1020cc";
    ctx.fillRect(0, playH, world.w, controlH);
    ctx.strokeStyle = "#4a6a9a88";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, playH);
    ctx.lineTo(world.w, playH);
    ctx.stroke();
    ctx.fillStyle = "#9eb6dccc";
    ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("喷气区 · 下方喷底 / 上方喷顶 · 单指拖动（全屏亦可）", world.w / 2, playH + 22);

    drawMinimap();
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    const steps = 2;
    const h = dt / steps;
    for (let s = 0; s < steps; s++) {
      applyThrustForces(h);
      integrate(h);
    }
    updateCamera(dt);

    const alt = Math.max(0, altitude());
    const spd = Math.hypot(craft.vx, craft.vy);
    const deg = (craft.angle * 180 / Math.PI).toFixed(0);
    const fuelPct = Math.max(0, Math.min(100, fuel));
    altEl.textContent = `高度 ${alt.toFixed(0)} m`;
    fuelEl.classList.toggle("low", fuelPct <= 25);
    fuelEl.innerHTML = `燃料 ${fuelPct.toFixed(0)}%<span class="bar"><i style="transform:scaleX(${(fuelPct / 100).toFixed(3)})"></i></span>`;
    const firingN = pointers.filter(p => p.nozzle != null && (p.fx || p.fy)).length;
    const boundN = pointers.filter(p => p.nozzle != null).length;
    let status = `喷 ${firingN}/${boundN}/${totalNozzles()} · 倾角 ${deg}° · 速 ${spd.toFixed(0)}`;
    if (fuel <= 0) status += " · 燃料耗尽";
    else status += ` · 偏角≤${cfg.maxAngleDeg}°`;
    statEl.textContent = status;
    draw();
    requestAnimationFrame(frame);
  }

  bindControls();
  resize();
  applyCraftType("rect", false);
  reset();
  window.addEventListener("resize", () => { resize(); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", () => { resize(); });
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
